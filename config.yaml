global:
  mouse_sensitivity: 1.4
  scroll_sensitivity: 1.0
  deadzone: 0.15
  cursor_speed_curve: linear
  mode_switch_hold_ms: 500
  mouse_speed_boost: 3.4
modes:
  mouse:
    switch_button: SELECT
    layers:
      vibe:
        hold_button: LB
        mappings:
          A: key.tab
          B: key.escape
          X: key.ctrl+enter
          Y: key.ctrl+shift+enter
          DPAD_UP: key.up
          DPAD_DOWN: key.down
          DPAD_LEFT: key.alt+[
          DPAD_RIGHT: key.alt+]
          LB: key.ctrl+c
          RB: key.ctrl+v
          LT: key.ctrl+z
          RT: key.ctrl+shift+z
          START: key.ctrl+s
          SELECT: null
          LEFT_STICK: key.ctrl+p
          RIGHT_STICK: key.ctrl+shift+p
    mappings:
      LEFT_STICK_X: mouse_x
      LEFT_STICK_Y: mouse_y
      RIGHT_STICK_X: scroll_x
      RIGHT_STICK_Y: scroll_y
      A: mouse_drag
      B: mouse_right
      X: key.space
      Y: key.f
      DPAD_UP: key.up
      DPAD_DOWN: key.down
      DPAD_LEFT: key.left
      DPAD_RIGHT: key.right
      LB: key.ctrl+shift+tab
      RB: key.ctrl+tab
      LT: key.media_volume_down
      RT: mouse_speed_hold
      START: key.m
      SELECT: switch_mode.vim
      LEFT_STICK: voice_input
      RIGHT_STICK: mouse_open_keyboard
  vim:
    switch_button: SELECT
    mappings:
      LEFT_STICK_X: null
      LEFT_STICK_Y: null
      DPAD_UP: nav.up
      DPAD_DOWN: nav.down
      DPAD_LEFT: nav.left
      DPAD_RIGHT: nav.right
      A: nav.click
      B: nav.escape
      X: nav.tab
      Y: nav.right_click
      LB: nav.prev_tab
      RB: nav.next_tab
      LT: nav.scroll_up
      RT: nav.speed_hold
      START: nav.enter
      SELECT: switch_mode.mouse
      LEFT_STICK: nav.refresh
      RIGHT_STICK: nav.open_keyboard
      RIGHT_STICK_X: scroll_x
      RIGHT_STICK_Y: scroll_y
